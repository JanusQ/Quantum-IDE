user root;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	tcp_nodelay on;
	keepalive_timeout 65;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1 TLSv1.1 TLSv1.2; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	server {
		listen 80;
		server_name janusq.zju.edu.cn;
	  location / {
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              set_real_ip_from 0.0.0.0/0;
              real_ip_header X-Forwarded-For;
              root /home/qc1/taiyuan_fornt/build/;
              index index.html;
              try_files $uri $uri/ /index.html;
            }
    location /api1 {
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header REMOTE-HOST $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                rewrite ^/api1/(.*)$ /$1 break;
                proxy_pass http://localhost:10212; 
                # 清除
    }
    location /admin {
                try_files $uri $uri/ /index.html;
        }
        
	}

	server {
        listen 10213;
        server_name janusq.zju.edu.cn;
        # server_name your.domain.com;
       location / {
              proxy_set_header Host $http_host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto https;
              set_real_ip_from 0.0.0.0/0;
              real_ip_header X-Forwarded-For;
              root /home/qc1/build/;
              index index.html;
              try_files $uri $uri/ /index.html;
            }
	
	}
	server {
    		server_name janusq.zju.edu.cn;

        listen 10217;
        # server_name your.domain.com;
        root /home/qc1/weiyunquantum/;
        index index.html index.htm;

	
	}
	

  server {
            listen 10210;
            server_name janusq.zju.edu.cn;
            location / {
              root /home/qc1/build_lab/;
              try_files $uri $uri/ /index.html;
            }
            error_page 500 502 503 504 /500.html;
            client_max_body_size 20M;
            keepalive_timeout 10;
    }
	

	server {
        listen 10213;
         # server_name your.domain.com;
        root /home/qc1/dzq-default-web-static/;
        index index.html index.htm;
		    location /api {
              proxy_pass   http://192.168.21.191:10214;
        }
        location / {
                try_files $uri $uri/ /index.html;
        }
        location ^~ /assets/ {
                gzip_static on;
                expires max;
                add_header Cache-Control public;
         }
        error_page 500 502 503 504 /500.html;
        client_max_body_size 20M;
        keepalive_timeout 10;
	}

}


